[metadata]
name = velabot-openwam-front
version = 0.1.0
description = Independent HTTP front for the pinned OpenWAM MoonCake model

[options]
py_modules =
    openwam_front
    safety
    source_identity
python_requires = >=3.10
install_requires =
    Pillow>=10,<13
    numpy>=1.24

[options.entry_points]
console_scripts =
    openwam-front = openwam_front:main
