# Independent fresh absolute-EEF experiment. Launch exactly four ranks.
defaults:
  - train_nero_8gpu
  - override dataloader: nero_multitask_absolute
  - _self_

training:
  finetune_ckpt_path: ${oc.env:OPENWAM_FOUNDATION_DIR,models/OpenWAM-Alpha-Pretrain-Foundation-Model}/checkpoint_step_154000.safetensors
  resume_ckpt_path: null
  output_path: outputs/nero_absolute_4gpu
  batch_size: 64
  gradient_accumulation_steps: 1
  # Global batch 256: 3209 updates/epoch, 16045 updates in five epochs.
  num_epochs: 5
  max_steps: null
  zero2_cached_grad_nodes: true
  cache_frozen_text_embeddings: true
  save_steps: 2000
  save_full_states_for_resume: true
  keep_last_k_ckpts: 1
  weight_archive_steps: [4000]
  weight_archive_path: outputs/nero_absolute_weights

project:
  wandb:
    run_name: nero-absolute-eef-4gpu-b64
